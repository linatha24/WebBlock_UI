# Branch flow: feature/<name> → pull request into dev → the designated teammate merges dev into Master (submission).
# Runs on every push to dev or Master, and on every pull request into dev or Master.
# Branch names are case-sensitive: the submit branch is "Master" with a capital M.
name: CI

on:
  push:
    branches: [dev, Master]
  pull_request:
    branches: [dev, Master]

# Saves Actions minutes (private repo: the organization's monthly allowance is shared by all its repos).
# A newer push to the same branch or pull request cancels the older, now-outdated run.
# Runs on Master are never cancelled, so every submission commit gets a full check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/Master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json "packageManager". Must run before setup-node.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (exactly as in pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Invariant checks (zero-transaction, boundaries, secrets, Server Action auth)
        run: node .claude/hooks/invariants.mjs --all

      - name: Invariant checker tests
        run: node --test .claude/hooks/invariants.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Build (also type-checks)
        run: pnpm build

  secrets:
    # Runs the open-source gitleaks CLI directly on GitHub's runner (no license needed, nothing to install
    # locally). Scans the files in this commit; it does NOT scan older git history.
    # TODO after the first green run: replace "latest" with the current version tag (e.g. v8.x.x) so an
    # upstream release can't break CI unexpectedly.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Scan for secrets (gitleaks)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest dir /repo --redact --verbose
